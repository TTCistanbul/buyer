<style>

  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:#12325c;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;flex-wrap:wrap}

  header small{display:block;opacity:.75;font-weight:400;font-size:12px}
  header a{color:#cfe0ff;font-size:13px}
  .hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .lang button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}
  .lang button.on{background:#fff;color:#12325c}
  main{max-width:880px;margin:0 auto;padding:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .panel h2{font-size:15px;margin:0 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
  input[type=text],input[type=email],input[type=password],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:15px;font-family:inherit;background:#fff}
  input.empty{border-color:#f0b37a;background:var(--warnbg)}
  input:disabled{background:#f3f4f6;color:#6b7280}
  textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace;color:#374151}
  .drop{border:2px dashed #9db4d3;border-radius:12px;padding:22px;text-align:center;background:#f8fbff;cursor:pointer}
  .drop.over{background:#e8f1fd}
  .drop strong{display:block;font-size:16px;margin-bottom:4px}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit}
  .btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  .btn.danger{background:#fff;color:#b91c1c;border:1px solid #e5a3a3}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .cardbox{display:grid;grid-template-columns:220px 1fr;gap:14px}

  .thumb{width:100%;border-radius:8px;border:1px solid var(--line);background:#eee;object-fit:contain;max-height:260px;cursor:zoom-in}
  .thumbs{display:grid;gap:6px}
  .status{font-size:13px;color:var(--mute);margin:6px 0}
  .bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden}
  .bar>div{height:100%;background:var(--accent);width:0;transition:width .2s}
  .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;flex-wrap:wrap}
  .meta{font-size:12px;color:var(--mute);margin-top:2px}
  .badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--warnbg);color:var(--warn);white-space:nowrap}
  .badge.ok{background:var(--okbg);color:var(--ok)}
  .badge.blue{background:var(--bluebg);color:var(--blue)}
  .badge.grey{background:#f3f4f6;color:#4b5563}
  .badge.dup{background:#fee2e2;color:#b91c1c}
  details summary{cursor:pointer;font-size:13px;color:var(--mute);margin-top:8px}
  .hint{font-size:13px;color:var(--mute);margin:6px 0 0}
  .sticky{position:sticky;bottom:0;background:rgba(245,246,248,.96);padding:10px 0;border-top:1px solid var(--line)}
  .count{font-size:14px;color:var(--mute)}
  .chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);margin:0}
  .chk.admin{color:var(--blue);font-weight:600}
  .filters button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit}

};
const FIELDS=["firstName","lastName","jobTitle","company","email","mobile","phone","website","address","city","country","source"];
const KEYF=["firstName","lastName","email","company"];
let lang=(()=>{try{return localStorage.getItem("cardLang")||"tr"}catch(e){return "tr"}})();
const t=k=>T[lang][k];

/* ---------- text helpers ---------- */
const fold=s=>(s||"").toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i");
const titleCase=s=>s.split(/\s+/).map(w=>w?w.charAt(0).toLocaleUpperCase("tr")+w.slice(1).toLocaleLowerCase("tr"):w).join(" ");
const isUpper=s=>s===s.toLocaleUpperCase("tr")&&/[A-ZÇĞİÖŞÜ]/.test(s);

const COMPANY_KW=["a.s.","a.ş.","as.","ltd","sti","şti","san.","sanayi","tic.","ticaret","holding","inc","gmbh","corp","co.","limited","group","grup","makina","makine","otomotiv","elektrik","elektronik","insaat","ithalat","ihracat ltd","dis tic","dış tic","teknoloji","industry","industries","trading"];
const TITLE_KW=["mudur","müdür","manager","director","direktor","başkan","baskan","president","ceo","cfo","coo","cto","owner","founder","kurucu","sahibi","ortak","partner","uzman","specialist","sorumlu","sorumlusu","yonetici","yönetici","executive","engineer","muhendis","mühendis","sales","satis","satış","satin alma","satınalma","purchasing","purchase","procurement","export","import","ihracat","ithalat","marketing","pazarlama","yonetim kurulu","chairman","koordinator","coordinator","temsilci","representative","assistant","asistan","officer","supervisor","sef","şef","lead","head","danisman","consultant","genel"];
const ADDR_KW=["mah.","mah ","mahallesi","cad.","cad ","caddesi","sok.","sk.","sokak","sokagi","bulvar","blv","bulv","no:","no.","no ","kat:","kat ","daire","d:","osb","organize sanayi","plaza","is merkezi","iş merkezi","sitesi","blok","street","st.","avenue","road","pk","posta"];
const CITIES=["İstanbul","Ankara","İzmir","Bursa","Kocaeli","Konya","Gaziantep","Kayseri","Antalya","Adana","Mersin","Manisa","Denizli","Eskişehir","Sakarya","Tekirdağ","Samsun","Trabzon","Hatay","Kahramanmaraş","Balıkesir","Aydın","Muğla","Malatya","Diyarbakır","Şanlıurfa","Çorum","Afyonkarahisar","Kütahya","Uşak","Bolu","Düzce","Edirne","Kırklareli","Çanakkale","Zonguldak","Ordu","Rize","Erzurum","Van","Sivas","Tokat","Yalova","Bilecik","Karaman","Aksaray","Niğde","Nevşehir","Isparta","Burdur","Osmaniye","Kırıkkale","Kırşehir","Elazığ","Batman","Mardin","Gebze"];
const FREEMAIL=["gmail","hotmail","yahoo","outlook","yandex","icloud","live","msn","mynet","windowslive"];
const hasKw=(s,list)=>{const f=" "+fold(s)+" ";return list.some(k=>f.includes(fold(k)))};

function normPhone(raw){
  let d=raw.replace(/[^\d+]/g,""); const plus=d.startsWith("+"); d=d.replace(/\+/g,"");
  if(d.startsWith("0090")) d=d.slice(2);
  if(d.length===12&&d.startsWith("90")) d=d.slice(2);
  else if(d.length===11&&d.startsWith("0")) d=d.slice(1);
  else if(!(d.length===10&&/^[2-5]/.test(d))) return {num:(plus?"+":"")+d,mobile:false,tr:false};
  return {num:`+90 ${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6,8)} ${d.slice(8)}`,mobile:d.startsWith("5"),tr:true};
}

function parseCard(text){
  const out={}; FIELDS.forEach(f=>out[f]="");
  const lines=text.split(/\n/).map(l=>l.replace(/[|•·]/g," ").replace(/\s+/g," ").trim()).filter(l=>l.length>1);
  const used=new Set(); const phones=[],mobiles=[];
  // email
  lines.forEach((l,i)=>{const m=l.replace(/\s*@\s*/g,"@").match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/);
    if(m&&!out.email){out.email=m[0].toLowerCase().replace(/[.,;]+$/,"");used.add(i);}});
  // website
  lines.forEach((l,i)=>{if(out.website||l.includes("@"))return;
    const m=l.match(/(https?:\/\/)?(www\.)[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)+|(https?:\/\/)?[A-Za-z0-9\-]+\.(com\.tr|com|net|org|net\.tr|biz|tr|eu|co)\b/i);
    if(m){out.website=m[0].replace(/^https?:\/\//i,"").toLowerCase();used.add(i);}});
  // phones
  lines.forEach((l,i)=>{const re=/\+?\(?\d[\d\s().\-\/]{8,}\d/g; let m,any=false,last=0;
    while((m=re.exec(l))){const r=m[0];const digits=r.replace(/\D/g,""); if(digits.length<10||digits.length>14)continue; any=true;
      // label = text between previous number and this one
      const lab=fold(l.slice(last,m.index)); last=m.index+r.length;
      const isFax=/(fax|faks|\bf\s*:|\bf\.)/.test(lab); const isMobLabel=/(gsm|cep|mobile|mob|\bm\s*:|\bm\.|cell)/.test(lab);
      if(isFax)continue; const p=normPhone(r);
      if(p.mobile||isMobLabel) mobiles.push(p.num); else phones.push(p.num);}
    if(any)used.add(i);});
  out.mobile=[...new Set(mobiles)][0]||""; out.phone=[...new Set(phones)][0]||"";
  if(!out.phone&&mobiles.length>1) out.phone=[...new Set(mobiles)][1]||"";
  // company
  lines.forEach((l,i)=>{if(used.has(i)||out.company)return; if(hasKw(l,COMPANY_KW)&&!hasKw(l,ADDR_KW)&&!/\d{3,}/.test(l)){out.company=l;used.add(i);}});
  // address & city
  const addr=[];
  lines.forEach((l,i)=>{if(used.has(i))return; if(hasKw(l,ADDR_KW)||/\b\d{5}\b/.test(l)||/\w+\s*\/\s*(istanbul|ankara|izmir|bursa|kocaeli)/i.test(fold(l))){addr.push(l);used.add(i);}});
  out.address=addr.join(", ");
  const blob=fold(addr.join(" ")+" "+lines.join(" "));
  const cityHit=CITIES.find(c=>fold(addr.join(" ")).includes(fold(c)))||CITIES.find(c=>new RegExp("\\b"+fold(c)+"\\b").test(blob));
  if(cityHit) out.city=cityHit==="Gebze"?"Kocaeli":cityHit;
  // job title
  lines.forEach((l,i)=>{if(used.has(i)||out.jobTitle)return; if(hasKw(l,TITLE_KW)&&!/\d/.test(l)&&l.length<70){out.jobTitle=l;used.add(i);}});
  // name: 2-4 words, letters only
  const nameRe=/^[A-Za-zÇĞİÖŞÜçğıöşüÂâÎîÛû.'\-]+(\s[A-Za-zÇĞİÖŞÜçğıöşüÂâÎîÛû.'\-]+){1,3}$/;
  let nameIdx=-1;
  const cands=lines.map((l,i)=>({l,i})).filter(o=>!used.has(o.i)&&nameRe.test(o.l)&&o.l.length<=40&&!hasKw(o.l,COMPANY_KW)&&!hasKw(o.l,TITLE_KW));
  if(cands.length){
    // prefer a candidate next to the job title line, else one whose last word is ALL CAPS, else first
    const tIdx=lines.indexOf(out.jobTitle);
    let pick=cands.find(o=>tIdx>=0&&Math.abs(o.i-tIdx)===1)||cands.find(o=>{const w=o.l.split(" ");return isUpper(w[w.length-1])&&!isUpper(w[0])})||cands[0];
    nameIdx=pick.i; used.add(pick.i);
    let w=pick.l.replace(/^(dr|prof|mr|mrs|ms|av|müh|muh|doç|doc)\.?\s+/i,"").split(" ");
    w=w.map(x=>titleCase(x));
    out.lastName=w.pop(); out.firstName=w.join(" ");
  }
  // company fallback from remaining ALL CAPS line or domain
  if(!out.company){
    const c=lines.find((l,i)=>!used.has(i)&&isUpper(l)&&!/\d{3,}/.test(l)&&l.length>2&&l.length<60);
    if(c) out.company=c;
    else {const dom=domainOf(out);if(dom) out.company=titleCase(dom.split(".")[0]);}
  }
  if(!out.website){const d=domainOf(out); if(d) out.website="www."+d;}
  return out;
}
function domainOf(o){
  if(o.website) return o.website.replace(/^www\./,"").split("/")[0];
  if(o.email){const d=o.email.split("@")[1]||"";if(!FREEMAIL.some(f=>d.startsWith(f+".")))return d;}
  return "";
}

/* ---------- images ---------- */
function fileToImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});}
function srcToImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
function drawRotated(im,rot,maxSide){
  let w=im.naturalWidth,h=im.naturalHeight; const k=Math.min(1,maxSide/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
  const swap=rot%180!==0; const cv=document.createElement("canvas"); cv.width=swap?h:w; cv.height=swap?w:h;
  const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.translate(cv.width/2,cv.height/2); ctx.rotate(rot*Math.PI/180); ctx.drawImage(im,-w/2,-h/2,w,h); return cv;
}
function toJpeg(im,rot){ // keep each photo well under Firestore's 1 MB document limit
  for(const [side,q] of [[1400,.72],[1200,.65],[1000,.6],[800,.55]]){ const u=drawRotated(im,rot,side).toDataURL("image/jpeg",q); if(u.length<650000) return u; }
  return drawRotated(im,rot,700).toDataURL("image/jpeg",.5);
}
function ocrCanvas(im,rot){
  let w=im.naturalWidth,h=im.naturalHeight; const big=Math.max(w,h); const k=big>2200?2200/big:big<1200?1200/big:1;
  const tmp=document.createElement("canvas"); tmp.width=Math.round(w*k); tmp.height=Math.round(h*k); tmp.getContext("2d").drawImage(im,0,0,tmp.width,tmp.height);
  const pseudo={naturalWidth:tmp.width,naturalHeight:tmp.height}; const cv=drawRotated(Object.assign(tmp,pseudo),rot,99999);
  const ctx=cv.getContext("2d"); const id=ctx.getImageData(0,0,cv.width,cv.height),d=id.data; let mn=255,mx=0; const g=new Uint8ClampedArray(d.length/4);
  for(let i=0,j=0;i<d.length;i+=4,j++){const v=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];g[j]=v;if(v<mn)mn=v;if(v>mx)mx=v;}
  const r=Math.max(1,mx-mn); for(let i=0,j=0;i<d.length;i+=4,j++){const v=(g[j]-mn)*255/r;d[i]=d[i+1]=d[i+2]=v;}
  ctx.putImageData(id,0,0); return cv;
}
async function loadPhoto(c){
  if(c.photoLoaded) return; c.photoLoaded=true;
  try{ const d=await db.collection("cardPhotos").doc(c.id).get(); const v=d.exists?d.data():{};
    if(v.front){ c.frontSrc=v.front; } if(v.back){ c.backSrc=v.back; } paint(c);
  }catch(e){ c.photoLoaded=false; }
}

/* ---------- OCR queue ---------- */
let workerP=null, current=null;
function getWorker(){ if(!workerP) workerP=Tesseract.createWorker(["tur","eng"],1,{logger:m=>{ if(current){ current.prog=m.progress||0; current.status=m.status==="recognizing text"?"reading":"loading"; progress(current);} }}); return workerP; }
const queue=[]; let busy=false;
function enqueue(job){ queue.push(job); runQueue(); }
function cleanAI(r){
  const o={}; const str=v=>(v==null?"":String(v)).replace(/\s+/g," ").trim();
  ["firstName","lastName","jobTitle","company","address","city","country"].forEach(k=>o[k]=str(r[k]));
  o.email=str(r.email).toLowerCase().replace(/\s/g,"");
  o.website=str(r.website).replace(/^https?:\/\//i,"").replace(/\/$/,"").toLowerCase();
  const ph=v=>{ v=str(v); if(!v) return ""; const p=normPhone(v); return p.tr?p.num:v; };
  o.mobile=ph(r.mobile); o.phone=ph(r.phone);
  if(!o.website){ const d=domainOf(o); if(d) o.website="www."+d; }
  return o;
}
async function runQueue(){
  if(busy) return; busy=true;
  while(queue.length){
    const job=queue.shift(), c=job.card; current=null; c.prog=0; c.note="";
    let parsed=null, text="";
    if(window.geminiRead){
      try{ c.status="ai"; paint(c);
        const imgs=job.side==="back"?[c.frontSrc,c.backSrc].filter(Boolean):[c.frontSrc];
        const r=await window.geminiRead(imgs); parsed=cleanAI(r); text=String(r.raw||"").trim(); }
      catch(e){ console.warn("Gemini:",e); c.note=t("aiFallback")+" ("+String((e&&(e.code||e.message))||e).slice(0,90)+")"; parsed=null; }
    } else if(window.geminiError){ c.note=t("aiFallback")+" ("+window.geminiError+")"; }
    if(!parsed){
      current=c; c.status="loading"; paint(c);
      try{ const w=await getWorker(); c.status="reading"; paint(c); const {data}=await w.recognize(ocrCanvas(job.img,job.rot||0)); text=(data.text||"").trim(); }
      catch(e){ console.error(e); }
      parsed=text?parseCard(text):{};
    }
    const patch={ocr:"done"};
    if(job.side==="back"){
      patch.raw=(c.data.raw||"")+"\n--- (arka / 背面) ---\n"+text;
      FIELDS.forEach(f=>{ if(!c.data[f]&&parsed[f]) patch[f]=parsed[f]; });
    } else {
      patch.raw=text;
      const touched=c.touched||{};
      FIELDS.forEach(f=>{ if(f==="source")return; if(f==="country"){ if(parsed.country&&!touched.country) patch.country=parsed.country; return; } if(!touched[f]) patch[f]=parsed[f]||""; });
      if(!patch.country&&!c.data.country) patch.country=$("#s-country").value.trim();
    }
    c.status=(text||Object.values(parsed).some(Boolean))?"done":"failed"; c.prog=1; current=null;
    saveFields(c,patch,true); paint(c);
  }
  busy=false;
}

async function addFiles(files){
  const src=$("#s-source").value.trim(), ctry=$("#s-country").value.trim(), who=USER.email;
  for(const file of files){
    if(!file.type.startsWith("image/")) continue;
    let im; try{ im=await fileToImage(file); }catch(e){ continue; }
    const id=db.collection("cards").doc().id, now=new Date().toISOString();
    const data={ocr:"pending",raw:"",staffOk:false,evaOk:false,exported:false,source:src,country:ctry,by:(USER.displayName||who),byEmail:who,at:now};
    FIELDS.forEach(f=>{ if(!(f in data)) data[f]=""; });
    const c={id,data,local:true,img:im,rot:0,status:"queued",prog:0,photoLoaded:true};
    c.frontSrc=toJpeg(im,0); CARDS.set(id,c); if(filter!=="todo"&&filter!=="all") setFilter("todo"); else renderList();
    try{ await db.collection("cardPhotos").doc(id).set({front:c.frontSrc,byEmail:who,at:now});
         await db.collection("cards").doc(id).set(data); }
    catch(e){ $("#g-msg").textContent=t("saveErr")+(e.code||e.message); }
    enqueue({card:c,img:im,rot:0,side:"front"});

}
let backFor=null;
async function addBack(c,file){
  let im; try{ im=await fileToImage(file); }catch(e){ return; }

  try{ await db.collection("cardPhotos").doc(c.id).set({back:c.backSrc},{merge:true}); }catch(e){ $("#g-msg").textContent=t("saveErr")+(e.code||e.message); }

}
async function rotate(c){
  c.rot=((c.rot||0)+90)%360;
  let im=c.img; if(!im){ await loadPhoto(c); if(!c.frontSrc) return; im=c.img=await srcToImage(c.frontSrc); c.baseSrc=c.frontSrc; }
  c.frontSrc=toJpeg(im,c.rot); paint(c);
  try{ await db.collection("cardPhotos").doc(c.id).set({front:c.frontSrc},{merge:true}); }catch(e){}

}

const $=s=>document.querySelector(s);
const fmt=s=>{ if(!s) return ""; const d=new Date(s); return d.toLocaleDateString(lang==="tr"?"tr-TR":"zh-TW")+" "+d.toLocaleTimeString(lang==="tr"?"tr-TR":"zh-TW",{hour:"2-digit",minute:"2-digit"}); };
function dupEmails(){ const m={}; for(const c of CARDS.values()){ const e=(c.data.email||"").toLowerCase(); if(e&&!c.data.exported) m[e]=(m[e]||0)+1; } return m; }
function sorted(){ return [...CARDS.values()].sort((a,b)=>String(b.data.at||"").localeCompare(String(a.data.at||""))); }
function renderList(){
  const box=$("#cards"); const list=sorted().filter(c=>inFilter(c.data));

function build(c){
  const n=$("#tpl").content.firstElementChild.cloneNode(true); c.el=n;
  n.querySelectorAll("[data-i]").forEach(el=>{el.textContent=t(el.dataset.i)});

    const inp=d.querySelector("input");
    inp.addEventListener("input",()=>{ c.touched=c.touched||{}; c.touched[f]=true; saveFields(c,{[f]:inp.value.trim()}); inp.classList.toggle("empty",!inp.value&&KEYF.includes(f)); head(c); }); });
  n.querySelector(".ok").addEventListener("change",e=>{ saveFields(c,{staffOk:e.target.checked,staffBy:USER.email},true); head(c); });
  const ap=n.querySelector(".appr"); n.querySelector(".chk.admin").hidden=!isAdmin();

  n.querySelector(".del").addEventListener("click",async()=>{
    if(!isAdmin()&&c.data.byEmail!==USER.email){ toast(t("delNo")); return; }
    if(!(await ask(t("confirmDel")))) return;
    try{ await db.collection("cardPhotos").doc(c.id).delete(); }catch(e){}
    db.collection("cards").doc(c.id).delete().catch(e=>{$("#g-msg").textContent=t("saveErr")+(e.code||e.message);});
    c.local=false; if(c.el) c.el.remove(); CARDS.delete(c.id); renderList(); });
  n.querySelector(".rot").addEventListener("click",()=>rotate(c));
  n.querySelector(".back").addEventListener("click",()=>{ backFor=c; $("#file-back").click(); });
  n.querySelectorAll(".thumb").forEach(im=>im.addEventListener("click",()=>{ if(!im.src) return; $("#zoom img").src=im.src; $("#zoom").style.display="flex"; }));
  loadPhoto(c);
}
function paint(c){
  if(!c.el) return; const n=c.el, d=c.data;
  const fr=n.querySelector(".front"), bk=n.querySelector(".backimg");
  if(c.frontSrc){ fr.src=c.frontSrc; fr.hidden=false; } else fr.hidden=true;
  if(c.backSrc){ bk.src=c.backSrc; bk.hidden=false; } else bk.hidden=true;
  const locked=!!d.exported&&!isAdmin();
  FIELDS.forEach(f=>{ const inp=n.querySelector(`[data-f="${f}"]`); if(document.activeElement!==inp&&!(c.pending&&f in c.pending)) inp.value=d[f]||""; inp.disabled=locked; inp.classList.toggle("empty",!inp.value&&KEYF.includes(f)); });
  n.querySelector(".raw").value=d.raw||"";
  n.querySelector(".ok").checked=!!d.staffOk; n.querySelector(".ok").disabled=locked;
  n.querySelector(".appr").checked=!!d.evaOk;
  n.querySelector(".chk.admin").hidden=!isAdmin();
  n.querySelector(".rot").disabled=locked||busyOn(c); n.querySelector(".back").disabled=locked||busyOn(c); n.querySelector(".del").disabled=locked;
  const st={queued:t("waiting"),ai:t("aiReading"),loading:t("loadingModel"),reading:t("reading"),failed:t("failed"),remote:t("reading")}[c.status]||"";

function progress(c){ if(!c.el) return; const b=c.el.querySelector(".bar"); b.style.display=busyOn(c)?"":"none"; b.firstElementChild.style.width=(c.status==="ai"?60:Math.round((c.prog||0)*100))+"%";
  const st={loading:t("loadingModel"),reading:t("reading")}[c.status]; if(st) c.el.querySelector(".status").textContent=st+(c.prog?` ${Math.round(c.prog*100)}%`:""); }
function head(c){ if(!c.el) return; const d=c.data; const nm=[d.firstName,d.lastName].filter(Boolean).join(" ")||"—";
  c.el.querySelector(".cname").textContent=nm+(d.company?" · "+d.company:"");

async function doExport(){

<script type="module">
// Gemini (Firebase AI Logic) reads the card photo(s) and returns the fields as JSON.
const V="13.4.0", B=`https://www.gstatic.com/firebasejs/${V}/`;
try{
  const {initializeApp}=await import(B+"firebase-app.js");
  const {getAI,getGenerativeModel,GoogleAIBackend}=await import(B+"firebase-ai.js");
  const app=initializeApp(FIREBASE_CONFIG,"ai");
  if(RECAPTCHA_SITE_KEY){ const {initializeAppCheck,ReCaptchaV3Provider}=await import(B+"firebase-app-check.js");
    initializeAppCheck(app,{provider:new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),isTokenAutoRefreshEnabled:true}); }
  const ai=getAI(app,{backend:new GoogleAIBackend()});
  const F=["firstName","lastName","jobTitle","company","email","mobile","phone","website","address","city","country","raw"];
  const schema={type:"object",properties:Object.fromEntries(F.map(k=>[k,{type:"string"}])),required:F};
  const PROMPT=`You read business cards, mostly from Turkish companies (Turkish and/or English text; there may be a front and a back photo of the same card).
Return one JSON object for the person on the card:
- firstName: all given names (Turkish cards often have two), lastName: family name. Write names in normal case (e.g. "Mehmet Ali", "Yılmaz"), not ALL CAPS. Keep Turkish letters (ç ğ ı İ ö ş ü).
- jobTitle: as written on the card (prefer the English one if both exist).
- company: the full legal company name as printed (e.g. "... San. ve Tic. A.Ş."); if only a brand/logo text is visible, use that.
- email, website (no http://).
- mobile: mobile/GSM/Cep number; phone: landline/Tel number. Never use the fax number. Write Turkish numbers as +90 XXX XXX XX XX.
- address: street address without city and country; city: the province (İl), e.g. İstanbul, Bursa; country: country name in English (Turkey if Turkish address).
- raw: every piece of text on the card(s), line by line.
Use "" for anything not on the card. Do not guess or invent anything.`;
  window.geminiRead=async(dataUrls)=>{
    const parts=[{text:PROMPT}, ...dataUrls.map(u=>({inlineData:{mimeType:"image/jpeg",data:u.split(",")[1]}}))];
    let last;
    for(const m of GEMINI_MODELS){
      try{
        const model=getGenerativeModel(ai,{model:m,generationConfig:{responseMimeType:"application/json",responseJsonSchema:schema,temperature:0}});
        const res=await model.generateContent(parts);
        return JSON.parse(res.response.text());
      }catch(e){ last=e; const msg=String(e&&e.message||e);
        if(!/not found|404|not supported|unsupported|429|quota|RESOURCE_EXHAUSTED|503|overloaded/i.test(msg)) throw e; }
    }
    throw last;
  };
}catch(e){ window.geminiError=String(e&&e.message||e).slice(0,90); console.warn("Gemini setup:",e); }
</script>
